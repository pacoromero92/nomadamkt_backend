name: Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable maintenance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔴 Activando mantenimiento..."
            sudo -n /usr/local/bin/maintenance-on

      - name: Deploy Backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/apiperformance.nomadadigital.mx

            echo "📥 Actualizando código..."
            git fetch origin
            git reset --hard origin/master

            echo "🐍 Activando entorno virtual..."
            source backend.venv/bin/activate

            echo "📦 Instalando dependencias..."
            pip install -r requirements.txt

            echo "🗄️ Ejecutando migraciones..."
            alembic upgrade head

            echo "🔄 Reiniciando FastAPI..."
            sudo -n systemctl restart apiperformance.service

            echo "⏳ Esperando servicio..."
            sleep 3

            echo "🔎 Verificando servicio..."
            sudo -n systemctl is-active --quiet apiperformance.service

            echo "✅ Backend desplegado correctamente"
      - name: Disable maintenance
        if: success()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🟢 Desactivando mantenimiento..."
            sudo -n /usr/local/bin/maintenance-off
